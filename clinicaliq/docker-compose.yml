name: clinicaliq

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicaliq}
      POSTGRES_USER: ${POSTGRES_USER:-clinicaliq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicaliq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinicaliq_net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    env_file:
      - path: .env
        required: false
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/readyz || curl -fsS http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - clinicaliq_net

  backend:
    build:
      context: ..
      dockerfile: clinicaliq/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicaliq}:${POSTGRES_PASSWORD:-clinicaliq}@postgres:5432/${POSTGRES_DB:-clinicaliq}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CLINICALIQ_DB_PATH: /app/data/clinicaliq.db
      CLINICALIQ_REPORTS_DIR: /app/data/reports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - clinicaliq_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    env_file:
      - path: .env
        required: false
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - clinicaliq_net

networks:
  clinicaliq_net:
    name: clinicaliq_net

volumes:
  postgres_data:
  qdrant_data:
  backend_data:

services:
  inference-api:
    build:
      context: .
      dockerfile: inference-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_ROOT=/app/Models

  deepcarex-web:
    build:
      context: ./deepcarex-web
      dockerfile: Dockerfile
      args:
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://inference-api:8000}
    ports:
      - "3001:3001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - inference-api
